name: Daily AI Radio

on:
  schedule:
    - cron: "0 21 * * *"  # JST 06:00 = UTC 21:00（前日）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai edge-tts mutagen

      - name: Generate radio episode and RSS feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RADIO_SECRET: ${{ secrets.RADIO_SECRET }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          LOCAL_CONTEXT: ${{ secrets.LOCAL_CONTEXT }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: |
          python scripts/generate_radio.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
